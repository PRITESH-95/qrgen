[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qr-generator"
version = "1.0.0"
description = "Generate permanent, static QR-code PNGs from links."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Pritesh Shinde" }]
keywords = ["qr", "qrcode", "generator", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "qrcode[pil]>=7.4,<9",
]

[project.scripts]
qrgen = "qr_generator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qr_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
